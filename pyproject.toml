[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egip"
version = "0.4.0"
description = "Evidence-guided intervention planning for factual error correction (paper v4)"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "scikit-learn>=1.2", "tomli>=2; python_version<'3.11'"]

[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.49", "sentence-transformers>=2.7,<6"]
generate = ["vllm>=0.6", "transformers>=4.49", "sentence-transformers>=2.7"]
score = ["torch>=2.2", "transformers>=4.49", "nltk>=3.9", "rouge==1.0.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"egip._vendor" = ["LICENSE"]
